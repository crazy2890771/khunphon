<style>
/* Layout: one narrow column like a war-table ledger; camp screens above, battle board with enemy ranks on top and allies below */
:root{
  --bg:#171c19; --board:#1f2622; --panel:#27302b; --line:#3a453e;
  --text:#ece4d2; --muted:#a9a592; --bronze:#caa55e; --bronze-ink:#231c0e;
  --ally:#5fa38a; --enemy:#c8553d; --heal:#7cc68f; --crit:#f2c14e; --well:#0e120f;
  --earth:#b08a4a; --water:#4f8fc0; --fire:#d0603f; --wind:#7fb07a;
  --grass1:#3f6a34; --grass2:#5b8a42;
  --f-display:"Pridi",Georgia,"Noto Serif Thai",serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:10px}

.eyebrow{margin:0;font-size:11px;letter-spacing:.1em;color:var(--muted)}
button{font:inherit;color:var(--text);background:var(--board);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;line-height:1.25;min-height:40px}
button:hover:not(:disabled){border-color:var(--bronze)}
button:focus-visible,input:focus-visible{outline:2px solid var(--bronze);outline-offset:1px}
button:disabled{opacity:.4;cursor:not-allowed}
button small{display:block;font-size:10.5px;color:var(--muted)}
.primary{background:var(--bronze);color:var(--bronze-ink);border-color:var(--bronze);font-weight:600}
.el{flex:none;display:inline-grid;place-items:center;min-width:22px;height:16px;padding:0 3px;border-radius:3px;font-size:10px;font-weight:600;color:var(--bronze-ink);font-family:var(--f-body)}
.el-earth{background:var(--earth)}.el-water{background:var(--water)}.el-fire{background:var(--fire)}.el-wind{background:var(--wind)}
.bar{height:5px;background:var(--well);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .35s}
.num{font-variant-numeric:tabular-nums}

.title{position:fixed;inset:0;z-index:950;background:#0b0806}
.title-in{position:relative;max-width:560px;height:100%;margin:0 auto;background:url(sprites/title.webp) center top/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;animation:tfade .8s ease}
.title-in::after{content:'';position:absolute;inset:auto 0 0 0;height:32%;background:linear-gradient(transparent,rgba(8,5,3,.85));pointer-events:none}
.title-btns{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 24px calc(28px + env(safe-area-inset-bottom))}
.title-go{width:min(280px,100%);min-height:52px;font-size:18px;letter-spacing:.06em;box-shadow:0 0 22px rgba(230,170,70,.45);animation:tpulse 2.2s ease-in-out infinite}
.title-who{margin:0;font-size:13px;color:#f3dcb0;text-shadow:0 1px 3px #000}
.title-tap{margin:0;font-size:11px;color:#cdb68f;opacity:.8;text-shadow:0 1px 3px #000}

@keyframes tpulse{0%,100%{box-shadow:0 0 14px rgba(230,170,70,.35)}50%{box-shadow:0 0 28px rgba(230,170,70,.7)}}

.nextbtns{display:flex;flex-direction:column;gap:6px;flex:none}.nextbtns button:not(.primary){min-height:32px;font-size:11px;padding:4px 8px}
.capwarn{color:var(--crit)!important;font-size:11px}

@media (prefers-reduced-motion:reduce){.idlespr{animation:none}}

.unlockbox h2{color:var(--bronze);font-size:20px}.unl{background:var(--well);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px}.unl>div{flex:1;min-width:0}.unl button{flex:none;min-height:34px;padding:4px 10px;font-size:12.5px;border-color:var(--bronze);color:var(--bronze)}

.field.spd3 .unit{transition-duration:.14s}.field.spd3 .float{animation-duration:.6s}
.arlad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.arlad .rk{background:var(--well);border:1px solid var(--line);border-radius:6px;padding:3px 2px;text-align:center;opacity:.55}

.arprog small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.arprog .bar{height:6px}.arprog .bar i{background:var(--crit)}
.arrw{display:flex;flex-direction:column;gap:6px}.arrw button{text-align:left}
.arshop{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.arsh{display:grid;grid-template-columns:1fr 1fr;gap:5px}.arsh button{display:flex;align-items:center;gap:6px;text-align:left;padding:5px 7px}.arsh span{font-size:12px;min-width:0}
.twms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.twm{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:6px}.twm b{display:block;font-size:13px;color:var(--bronze)}.twm small{font-size:10.5px;color:var(--muted)}
.twm.big{border-color:var(--crit);box-shadow:0 0 10px rgba(230,170,70,.3)}.twm.big b{color:var(--crit)}
.slotbd{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1;background:url(sprites/slotboard.webp) center/100% 100% no-repeat;border-radius:10px}

.sl-cell.t1{box-shadow:inset 0 0 0 2px #8a5ad0}.sl-cell.t2{box-shadow:inset 0 0 0 2px #e0a030,inset 0 0 10px rgba(230,170,50,.6)}.sl-cell.t3{box-shadow:inset 0 0 0 3px #ff5a3a,inset 0 0 14px rgba(255,120,40,.8)}
.sl-cell.got{background:rgba(40,20,10,.55)}.sl-x{font-size:10px;color:#f3dcb0}
.sl-cell.run{box-shadow:0 0 0 3px #fff6c0,0 0 16px 6px rgba(255,220,90,.9)!important;background:rgba(255,240,170,.35)}

.sl-gear{font-size:9.5px;font-weight:700;padding:1px 3px;border-radius:3px;background:rgba(0,0,0,.65);color:#fff}
.sl-spin{position:absolute;left:50%;top:64.2%;width:18.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff6a50,#b8180e);border:0;color:#fff4d0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;min-height:0;text-shadow:0 1px 2px #000;box-shadow:0 0 14px rgba(255,90,50,.6)}
.sl-spin b{font-size:clamp(13px,4vw,20px)}.sl-spin small{font-size:clamp(9px,2.6vw,12px);color:#ffe3a0}
.sl-spin:disabled{opacity:.6}
.forgemsg.big{font-size:14px;font-weight:600}
.primary small{color:rgba(38,26,8,.78)!important;font-weight:500}
.rkico{display:inline-block;vertical-align:middle;background:url(sprites/ranks.webp) 0 0/700% 100% no-repeat;flex:none}
.arlad .rk{display:flex;flex-direction:column;align-items:center;gap:1px}
.tuto{margin:0 0 6px;padding:7px 9px;border-radius:8px;background:rgba(201,164,92,.14);border:1px dashed var(--bronze);font-size:12px;line-height:1.5}
.intro{position:fixed;inset:0;z-index:955;background:#0b0806}
.intro-in{position:relative;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.intro-img{position:absolute;inset:0;transition:background-position .8s ease;background:url(sprites/intro.webp) center 30%/cover no-repeat;animation:introPan 30s ease-in-out infinite alternate}
@keyframes introPan{from{background-position:30% 30%}to{background-position:70% 30%}}
.intro-box{position:relative;margin:0 12px calc(18px + env(safe-area-inset-bottom));background:rgba(14,10,6,.86);border:1px solid var(--bronze);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:tfade .35s ease}
.intro-who{display:flex;align-items:center;gap:8px}.intro-who b{color:var(--bronze);font-size:15px}
.intro-box p{margin:0;font-size:15px;line-height:1.6;color:#f3e6c8}.intro-box p.narr{font-style:italic;color:#e6d3a8}
.intro-box small{align-self:flex-end;font-size:10.5px;color:var(--muted)}
.intro-skip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;min-height:34px;font-size:12px;background:rgba(0,0,0,.55)}
@media (prefers-reduced-motion:reduce){.intro-img{animation:none}}
.htitle{margin:2px 0 0;font-size:12px;color:var(--crit);letter-spacing:.04em}
.hub .hubt.ac{background:linear-gradient(160deg,#3a2f18,var(--board));border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.achs{display:flex;flex-direction:column;gap:6px}.ach{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:4px}
.ach.rdy{border-color:var(--crit);box-shadow:0 0 8px rgba(230,170,70,.3)}.ach.max{opacity:.7}.ach small{font-size:11px;color:var(--muted)}
.achh{display:flex;justify-content:space-between;align-items:center;gap:6px}.achh b{font-size:13px}.achst{display:flex;gap:3px}.achst i{width:9px;height:9px;border-radius:50%;background:var(--line)}.achst i.on{background:var(--crit)}
.ach .bar{height:4px}.ach .bar i{background:var(--bronze)}.ach button{min-height:32px;font-size:12px;align-self:flex-start}
.lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.lday{position:relative;background:var(--well);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:62px}
.lday b{display:block;font-size:12px}.lday small{font-size:10px;color:var(--muted);line-height:1.35}.lday.got{opacity:.45}.lday em{position:absolute;top:4px;right:6px;color:var(--heal);font-style:normal}
.lday.now{border-color:var(--crit);box-shadow:0 0 10px rgba(230,170,70,.45)}.lday.big{grid-column:1/-1;border-color:color-mix(in srgb,var(--crit) 60%,var(--line))}.lday.big b{color:var(--crit)}
.achico{display:inline-block;flex:none;vertical-align:middle;background:url(sprites/achicons.webp) 0 0/1400% 100% no-repeat}
.ach{flex-direction:row!important;align-items:flex-start;gap:9px!important}.achb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ach.max .achico{filter:drop-shadow(0 0 6px rgba(230,170,70,.7))}.ach:not(.max):not(.rdy) .achico{filter:saturate(.75)}
.lghead{display:flex;align-items:center;gap:10px}.lday.big{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px}.lday.big small{flex-basis:100%}

.plate{width:84px!important}.unit.A .plate{width:94px!important}.field.crowd .unit.E:not(.boss):not(.recr) .plate{width:58px!important}

.btog{flex:1 1 auto!important;flex-wrap:wrap;justify-content:flex-end;row-gap:5px}

}

function canLearn(h,k){const n=nodeOf(h.el,k);if(!n||n.t===0||learned(h,k)||h.lv<n.lv)return false;const prev=TREE[h.el][n.b][1][n.t-1][0];return learned(h,prev)&&(h.sp||0)>=TIER_COST[n.t];}

function parseSave(raw){raw=String(raw||'');
  let want=0;const m=raw.match(/KP2:(\d+):/);if(m){want=+m[1];raw=raw.slice(raw.indexOf(m[0])+m[0].length);}else{const i=raw.indexOf('KP1:');if(i>=0)raw=raw.slice(i+4);}
  let b=raw.replace(/[^A-Za-z0-9+/=_-]/g,'').replace(/-/g,'+').replace(/_/g,'/');
  if(want&&b.length<want)return {err:`รหัสเซฟไม่ครบ (ได้ ${b.length.toLocaleString()} จาก ${want.toLocaleString()} ตัวอักษร) ลองคัดลอกใหม่ หรือใช้ปุ่มบันทึกเป็นไฟล์`};
  if(want)b=b.slice(0,want);b=b.replace(/=+$/,'');while(b.length%4)b+='=';
  try{const g=JSON.parse(decodeURIComponent(escape(atob(b))));if(saveOk(g))return {g};}catch(e){}
  return {err:'รหัสเซฟไม่ถูกต้อง ตรวจว่าวางครบทั้งหมด หรือใช้ปุ่มบันทึกเป็นไฟล์แทน'};}

let EXP_OVER=0;
function gainExp(o,amt,isHero){
  if((o.reborn||0)>0&&o.lv<40+10*((o.reborn||0)-1))amt*=2;
  o.exp+=amt;let up=0;const cap=maxLv(o);
  while(o.lv<cap&&o.exp>=need(o.lv,o.reborn)){o.exp-=need(o.lv,o.reborn);o.lv++;up++;}
  if(o.lv>=cap&&o.exp>0){const g=Math.round(o.exp*0.05);G.gold+=g;EXP_OVER+=g;o.exp=0;}
  if(isHero)o.pts+=up*3;
  ensureSkill(o);o.sp+=up;
  return up;
}

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TOWER_POOL=['bandit','spear','firebrand','ebow','priest','xiliang','guard','ironbow','strategist','firetroop','crossbow','pikeman','ironcav','medic','navy','tigerguard','firearcher','weistrat'];

function towerStage(f){
  const r=rng(f*7919+13),lv=Math.round(4+f*0.7),n=f<10?4:5,front=[],back=[];
  for(let i=0;i<n;i++){const k=TOWER_POOL[Math.floor(r()*TOWER_POOL.length)];((FOE[k].ranged||['priest','strategist','medic','weistrat'].includes(k))?back:front).push(k);}
  const boss=f%10===0?TOWER_BOSS[(f/10-1)%TOWER_BOSS.length]:null;
  if(boss)front.splice(Math.min(1,front.length),0,boss);
  while(front.length>4)back.push(front.pop());
  while(back.length>4)front.push(back.pop());
  if(!front.length)front.push(back.pop());
  return {name:'หอท้าประลอง ชั้น '+f,lv,front,back,exp:20+f*8,gold:30+Math.min(f,100)*6+Math.max(0,f-100)*2,tower:f,hard:!!boss,mul:(1+f*0.025)*(f>100?Math.pow(1.015,f-100):1),double:!!boss&&f>=50,

}

const SLOT_ORDER=[2,1,3,0,4];

function syncRow(id,row){if(id==='hero')G.hero.row=row;else if(G.roster[id])G.roster[id].row=row;}
function ensureFormation(){
  const members=['hero',...G.party];
  const F=G.formation&&Array.isArray(G.formation.front)&&Array.isArray(G.formation.back)?G.formation:{front:[null,null,null,null,null],back:[null,null,null,null,null]};
  const seen=new Set();
  ['front','back'].forEach(r=>{for(let i=0;i<5;i++){const id=F[r][i];
    if(!id||!members.includes(id)||seen.has(id))F[r][i]=null;else{seen.add(id);syncRow(id,r);}}});
  members.filter(id=>!seen.has(id)).forEach(id=>{
    const pref=id==='hero'?G.hero.row:G.roster[id].row;
    for(const r of [pref,pref==='front'?'back':'front']){
      const i=SLOT_ORDER.find(i=>!F[r][i]);
      if(i!==undefined){F[r][i]=id;syncRow(id,r);break;}
    }
  });
  G.formation=F;
}

const ROLE_W={front:{hp:.35,def:2.5,atk:2.5,spd:1.5,mp:.05},back:{hp:.25,def:1.5,atk:3.2,spd:2,mp:.15}};
function eqScore(x,m){const w=ROLE_W[(m==='hero'?G.hero.row:(G.roster[m]||{}).row)==='front'?'front':'back'],st=gearStats(x);let v=0;for(const k in st)v+=st[k]*(w[k]||0);
  if(x.aff)for(const k in x.aff)v+=(AFF[k].pct?x.aff[k]*2500:x.aff[k]*2);if(x.gems)x.gems.forEach(k=>{if(k)v+=150*(+k.split(':')[1]);});if(GEAR[x.id].owner===m)v+=5000;return v;}
function planEquip(){
  const mem=['hero',...G.party].sort((a,b)=>a==='hero'?-1:b==='hero'?1:powOf(memberStats(b))-powOf(memberStats(a)));
  const busy=new Set();Object.keys(G.equip).filter(m=>!mem.includes(m)).forEach(m=>Object.values(G.equip[m]).forEach(u=>busy.add(u)));
  const plan={},used=new Set();let changes=0;
  for(const sl of Object.keys(SLOTS)){const pool=G.gear.filter(x=>GEAR[x.id].slot===sl&&!busy.has(x.u));
    for(const m of mem){const ok=pool.filter(x=>!used.has(x.u)&&(!GEAR[x.id].owner||GEAR[x.id].owner===m)).sort((a,b)=>eqScore(b,m)-eqScore(a,m));
      const best=ok[0];(plan[m]=plan[m]||{})[sl]=best?best.u:null;if(best)used.add(best.u);if((best?best.u:null)!==(eqOf(m)[sl]||null))changes++;}}
  return {plan,changes};

function autoPlan(id,apply){

  const act=skillList(id).filter(([k,l])=>lv>=l).map(([k])=>k);
  if(id==='hero'){const h=o;const lr={...(h.lrn||{})};let go=true;while(go){go=false;const cand=treeNodes(h.el).filter(n=>n.t>0&&!lr[n.k]&&h.lv>=n.lv&&(n.t===1?h.lv>=TREE[h.el][n.b][1][0][1]:!!lr[TREE[h.el][n.b][1][n.t-1][0]])&&sp>=TIER_COST[n.t]).sort((a,b)=>a.t-b.t||a.b-b.b)[0];
    if(cand){sp-=TIER_COST[cand.t];lr[cand.k]=TIER_COST[cand.t];if(apply)h.lrn=lr;done[cand.k]=(done[cand.k]||0)+1;n++;act.push(cand.k);go=true;}}}
  for(;;){

    act.forEach((k,i)=>{const L=skl[k]||1;if(L<10&&L<=sp&&(!best||L<best.L||(L===best.L&&i>best.i)))best={k,L,i,cost:L};});

}

  if(st.arena||st.trial)return 0;
  if(st.heroic)return 8;
  if(st.tower)return Math.min(MAX_E,4+Math.floor(st.tower/12));
  if(st.wild)return st.front.length+st.back.length;
  if(i===0)return 4;
  return Math.min(MAX_E,({1:5,2:6,3:7,4:8})[st.ch]||8);
}
function fillStage(src,i){
  const st={...src,front:[...src.front],back:[...src.back]};
  const base=st.front.length+st.back.length,target=Math.max(base,enemyTarget(st,i));
  const pool=CH_POOL[Math.min(8,st.ch||Math.max(1,Math.ceil((st.tower||1)/25)))]||CH_POOL[1];
  const r=rng((i+2)*7331+(st.tower||0)*17+(st.heroic?99:0));
  while(st.front.length+st.back.length<target){
    const k=pool[Math.floor(r()*pool.length)];
    if(isBackFoe(k)&&st.back.length<ROW_E)st.back.push(k);
    else if(st.front.length<ROW_E)st.front.push(k);
    else if(st.back.length<ROW_E)st.back.push(k);
    else break;
  }
  while(st.front.length>ROW_E)st.back.length<ROW_E?st.back.push(st.front.pop()):st.front.pop();
  while(st.back.length>ROW_E)st.front.length<ROW_E?st.front.push(st.back.pop()):st.back.pop();
  const extra=st.front.length+st.back.length-base;
  if(extra>0){st.exp=Math.round(st.exp*(1+0.1*extra));st.gold=Math.round(st.gold*(1+0.1*extra));}
  return st;
}

const ROWPOS={E:{back:[25,40],front:[40,56]},A:{front:[58,72],back:[78,88]}};
const STEP=[13,-9];
function layout(){
  ['A','E'].forEach(s=>['front','back'].forEach(row=>{
    let l=side(s).filter(u=>u.row===row);
    const h=l.findIndex(u=>u.isHero);
    if(h>=0){const [hu]=l.splice(h,1);l.splice(Math.floor(l.length/2),0,hu);}
    const [cx,cy]=ROWPOS[s][row],n=l.length;
    if(s==='A'&&G.formation){
      const sl=u=>{const i=G.formation[row].indexOf(u.id);return i<0?2:i;};
      l.sort((a,b)=>sl(a)-sl(b));const sp=n<=2?1.15:n===3?1.05:0.85;
      l.forEach((u,i)=>{const o=(i-(n-1)/2)*sp;
        u._x=Math.min(88,Math.max(12,cx+o*STEP[0]));u._y=cy+o*STEP[1];});
      return;
    }
    if(s==='E'){const sp=n>=4?[12.5,-6.2]:[14,-8.5];l.forEach((u,i)=>{const o=i-(n-1)/2;u._x=Math.min(88,Math.max(12,cx+o*sp[0]));u._y=Math.max(28,cy+o*sp[1]);});return;}
    const k=n>3?0.72:1;
    l.forEach((u,i)=>{const o=(i-(n-1)/2)*k;u._x=Math.min(89,Math.max(11,cx+o*STEP[0]));u._y=cy+o*STEP[1];});
  }));
}

function tone(freq,dur,type='triangle',vol=0.15,when=0,slide=0){

function noise(dur,vol=0.2,when=0,hp=800){

  if(t.defDown)d*=1.25;

const spdLv=()=>G&&G.settings?(G.settings.spd||(G.settings.fast?2:1)):1;

async function resolve(){

function bfs(r,sx,sy,tx,ty){

    if(MV.prog>=1){MV.prog=0;MV.x=nx;MV.y=ny;MV.fx=nx;MV.fy=ny;MV.path.shift();mapArrive();if(!UI.map||B){MV.raf=0;return;}}

  heroTab:d=>{if(d.k==='stat')seeSoon('elchg');UI.heroTab=d.k;render();},
  forge:d=>{
    if(UI.forging)return;const x=gearByUid(+d.u);if(!x)return;const p=x.plus||0;if(p>=PLUS_MAX)return;const c=forgeCost(p);
    if(G.gold<c.gold||G.items.stone<c.stone)return;
    const rate=fRate(p),bl=useBless(p);if(bl)G.items.bless--;
    G.gold-=c.gold;G.items.stone-=c.stone;quest('forge');
    const ok=Math.random()<rate;let kind;
    if(ok){x.plus=p+1;kind='ok';UI.forgeMsg={ok:true,text:`ตีบวกสำเร็จ! ${gname(x)}${bl?' · ใช้หินสวรรค์':''}`};}
    else{if(p>=6&&UI.useCharm&&G.items.charm>0){G.items.charm--;kind='keep';UI.forgeMsg={ok:false,text:`ตีบวกล้มเหลว ยันต์กันถอยคุ้มครองไว้ ${gname(x)} ยังอยู่ขั้นเดิม`};}else if(p>=6){x.plus=p-1;kind='drop';UI.forgeMsg={ok:false,text:`ตีบวกล้มเหลว ${GEAR[x.id].name} ลดเหลือ +${x.plus}`};}else{kind='keep';UI.forgeMsg={ok:false,text:`ตีบวกล้มเหลว ${gname(x)} ยังอยู่ขั้นเดิม`};}}
    save();forgeFx({ok,kind,name:GEAR[x.id].name,from:p,to:x.plus||0,rate,col:gcol(x.id),bl});},
  trialGo:d=>{const o=memberObj(d.m);if(!o||o.lv<maxLv(o)||(o.reborn||0)>=MAX_REB||trialOk(o))return;UI.backTab=UI.tab;if(d.m!=='hero')UI.genOpen=d.m;startBattle(-1,trialStage(d.m));},
  rebPath:d=>{UI.rebPath=UI.rebPath||{};UI.rebPath[d.m]=UI.rebPath[d.m]===d.p?null:d.p;UI.confirmReb=null;render();},
  pathPend:d=>{const o=memberObj(d.m);if((o.reborn||0)-pathsOf(o).length<=0||!PATHS[d.p])return;o.paths=[...pathsOf(o),d.p];save();render();},
  rebKeep:d=>{const h=G.hero;const olds=treeNodes(h.el).map(n=>n.k).filter(k=>learned(h,k)).sort((a,b)=>(h.skl[b]||1)-(h.skl[a]||1));let sel=(UI.rebKeep||olds.slice(0,KEEP_MAX)).slice();
    if(sel.includes(d.k))sel=sel.filter(x=>x!==d.k);else{if(sel.length>=KEEP_MAX)sel.shift();sel.push(d.k);}UI.rebKeep=sel;render();},
  skLearn:d=>{const h=G.hero;ensureSkill(h);if(!canLearn(h,d.k))return;const n=nodeOf(h.el,d.k);h.sp-=TIER_COST[n.t];h.lrn[d.k]=TIER_COST[n.t];h.skl[d.k]=h.skl[d.k]||1;UI.skMsg={id:'hero',text:`เรียนสกิล ${SK[d.k].name} แล้ว`};sfx('win');save();render();},
  skSel:d=>{UI.skSel=UI.skSel===d.k?null:d.k;render();},
  rebEl:d=>{UI.rebEl=d.el;UI.confirmReb=null;render();},
  rebHero:()=>{
    const h=G.hero;if(h.lv<maxLv(h)||(h.reborn||0)>=MAX_REB)return;const pk=UI.rebPath&&UI.rebPath.hero,c=rebCost(h,true);if(!trialOk(h)||!costOk(c)||!pk)return;
    if(UI.confirmReb!=='hero'){UI.confirmReb='hero';render();return;}
    payCost(c);h.paths=[...pathsOf(h),pk];UI.rebPath.hero=null;{const ne=UI.rebEl||h.el;if(ne!==h.el){ensureSkill(h);const olds=treeNodes(h.el).map(n=>n.k).filter(k=>learned(h,k)).sort((a,b)=>(h.skl[b]||1)-(h.skl[a]||1));const keep=(UI.rebKeep||olds.slice(0,KEEP_MAX)).filter(k=>olds.includes(k)).slice(0,KEEP_MAX);let ref=0;
      olds.forEach(k=>{if(keep.includes(k))return;const L=h.skl[k]||1;ref+=L*(L-1)/2+((h.lrn||{})[k]||0);delete h.skl[k];if(h.lrn)delete h.lrn[k];});h.kept=[...new Set([...(h.kept||[]),...keep])].slice(-4);h.sp+=ref;}h.el=ne;UI.rebKeep=null;}
    h.reborn=(h.reborn||0)+1;h.lv=1;h.exp=0;for(const k in h.alloc)h.alloc[k]=0;h.pts=rebBonus(h.reborn);UI.confirmReb=null;UI.rebEl=null;save();render();},
  brk:d=>{const o=memberObj(d.m),n=brkN(o),c=brkCost(n);if(n>=BRK_MAX||(o.reborn||0)<MAX_REB||o.lv<maxLv(o)||G.items.brk<c.brk||G.gold<c.gold)return;
    if(UI.confirmBrk!==d.m){UI.confirmBrk=d.m;render();return;}
    G.items.brk-=c.brk;G.gold-=c.gold;o.brk=n+1;o.exp=0;UI.confirmBrk=null;sfx('win');save();render();},
  awk:d=>{const o=memberObj(d.m),n=awk(o),c=awkCost(n);if(n>=AWK_MAX||(o.reborn||0)<MAX_REB||o.lv<baseCap(o)||G.items.soul<c.soul||G.gold<c.gold)return;
    if(UI.confirmAwk!==d.m){UI.confirmAwk=d.m;render();return;}
    G.items.soul-=c.soul;G.gold-=c.gold;o.awk=n+1;UI.confirmAwk=null;sfx('win');save();render();},
  toggleWeekly:()=>{seeSoon('weekly');UI.showWeekly=!UI.showWeekly;render();},
  slotSpin:()=>{doSlotSpin();},
  slotSpin5:()=>{doSlotSpin(5);},
  slotRef:()=>{const S=ensureSlot(),c=slotRefCost();if(UI.slotSpin||G.gold<c)return;G.gold-=c;S.board=newBoard();UI.slotMsg={t:'เปลี่ยนกระดานแล้ว'};UI.slotWon=null;save();render();},
  toggleAch:()=>{seeSoon('ach');UI.showAch=!UI.showAch;UI.achMsg=null;render();},
  achClaim:d=>{const a=ACH.find(x=>x.k===d.k);if(!a)return;const m=achClaim(a);save();render();},
  achAll:()=>{ACH.forEach(a=>achClaim(a));save();render();},
  setTitle:d=>{G.title=d.t||'';save();render();},
  loginClaim:()=>{if(!loginReady())return;const d=G.login.n%7,r=loginRw(d);giveRw(r,loginGear());G.login.n++;G.login.last=today();save();render();},
  toggleTower:()=>{seeSoon('tower');UI.showTower=!UI.showTower;UI.twMsg=null;render();},
  twClaim:()=>{const fs=twUnclaimed();if(!fs.length)return;const all=[];fs.forEach(f=>{const gs=giveRw(twMs(f),towerRare(f));twGot().push(f);all.push(...gs);});
    UI.twMsg=`รับรางวัล ${fs.length} ชั้น (${fs[0]}–${fs[fs.length-1]})${all.length?' · ได้อุปกรณ์: '+all.join(', '):''}`;save();render();},
  arBuy1:()=>{ensureArena();const A=G.arena,c=arBuyCost();if((A.bought||0)>=AR_BUY_MAX||G.gold<c||A.used<arMax())return;G.gold-=c;A.bought=(A.bought||0)+1;UI.arMsg=`ซื้อสิทธิ์ประลองเพิ่ม 1 ครั้ง (${c.toLocaleString()} ตำลึง)`;save();render();},
  arSalary:()=>{ensureArena();const A=G.arena;if(A.salDay===today())return;A.salDay=today();const r=AR_DAY[arRankIdx(A.rating)];giveRw(r);UI.arMsg=`รับเงินเดือน ${arRank(A.rating)}: ${rwText(r)}`;save();render();},
  arUp:()=>{const un=arUnclaimed();if(!un.length)return;un.forEach(i=>{giveRw(AR_UP[i]);G.arena.rkGot.push(i);});UI.arMsg=`รับรางวัลเลื่อนขั้น ${un.map(i=>AR_RANKS[i][1]).join(', ')}: ${un.map(i=>rwText(AR_UP[i])).join(' + ')}`;save();render();},
  arBuy:d=>{ensureArena();const A=G.arena,x=AR_SHOP[+d.i];if(!x||(A.coin||0)<x.c)return;A.coin-=x.c;G.items[x.k]=(G.items[x.k]||0)+(x.n||1);UI.arMsg=`แลก ${ITEMS[x.k].name}${x.n?' ×'+x.n:''} แล้ว (เหลือ ${A.coin} เหรียญ)`;save();render();},
  toggleArena:()=>{seeSoon('arena');UI.showArena=!UI.showArena;if(UI.showArena)ensureArena();render();},
  arFight:d=>{ensureArena();const A=G.arena,o=A.opps[+d.i];if(!o||!fOpen('arena')||A.used>=arMax())return;A.used++;save();startBattle(-1,arenaStage(o));},
  arRefresh:()=>{if(G.gold<200)return;ensureArena();G.gold-=200;G.arena.opps=genOpps();save();render();},
  wkFight:()=>{ensureWeekly();if(!fOpen('weekly')||G.weekly.used>=WK_TRIES)return;G.weekly.used++;save();startBattle(-1,weeklyStage());},
  wkClaim:d=>{const i=+d.i,W=G.weekly;if(W.claimed.includes(i)||W.total<WK_MILE[i][0])return;const r=WK_MILE[i][1];
    W.claimed.push(i);G.gold+=r.gold||0;G.items.soul+=r.soul||0;G.items.brk+=r.brk||0;G.items.stone+=r.stone||0;if(r.gear)addGear(r.gear);sfx('coin');save();render();},
  rebGen:d=>{
    const r=G.roster[d.k];if(!r||r.lv<maxLv(r)||(r.reborn||0)>=MAX_REB)return;const pk=UI.rebPath&&UI.rebPath[d.k],c=rebCost(r,false);if(!trialOk(r)||!costOk(c)||!pk)return;
    if(UI.confirmReb!==d.k){UI.confirmReb=d.k;render();return;}
    payCost(c);r.paths=[...pathsOf(r),pk];UI.rebPath[d.k]=null;r.reborn=(r.reborn||0)+1;r.lv=1;r.exp=0;ensureSkill(r);r.sp+=5;UI.confirmReb=null;save();render();},
  buy:d=>{const it=ITEMS[d.k],n=+d.n||1;if(!it||it.noBuy||G.gold<it.price*n)return;G.gold-=it.price*n;G.items[d.k]+=n;UI.forgeMsg={ok:true,text:`ซื้อ ${it.name} ×${n} (${(it.price*n).toLocaleString()} ตำลึง) · มี ${G.items[d.k]}`};sfx('coin');save();render();},
  reset:()=>{if(!UI.confirmReset){UI.confirmReset=true;render();return;}
    try{localStorage.removeItem(KEY);}catch(e){}
    if(CLOUD){clearTimeout(cloudTimer);CLOUD.set({json:null,at:Date.now()}).catch(()=>{});}
    G=null;UI.confirmReset=false;UI.name='';render();},
  cmd:d=>{if(B&&B.phase==='command')battleCmd(d.c);},
  tgt:d=>{if(!B||!B.targeting)return;const t=B.targeting;B.targeting=null;t.done(BU(d.id));},
  peek:()=>{if(!B)return;B.peek=!B.peek;renderPanel();},
  again:d=>{if(!B||!B.result)return;const st=B.stage,i=B.i,fm=B.fromMap,nx=nextOpts();if(!(d.m==='next'?nx.next:nx.again))return;
    stopMusic();B=null;UI.eq=null;UI.map=fm;
    if(st.tower){startBattle(-1,towerStage(Math.min(TOWER_MAX,G.tower.best+1)));return;}
    const j=d.m==='next'?i+1:i;
    if(st.legend)startBattle(j,legendStage(j));else if(st.heroic)startBattle(j,heroicStage(j));else startBattle(j);},
  autoEquip:()=>{const {plan,changes}=planEquip();for(const m in plan){const e=eqOf(m);for(const sl in plan[m]){if(plan[m][sl])e[sl]=plan[m][sl];else delete e[sl];}}
    UI.quickMsg=changes?`เปลี่ยนอุปกรณ์ ${changes} ช่อง ให้ตัวหลักและขุนพลในทีม`:'ใส่ของดีที่สุดอยู่แล้ว';sfx('coin');save();render();},
  autoTeam:()=>{const b=planTeam();if(!b)return;const same=b.ids.every(k=>G.party.includes(k))&&G.party.length===b.ids.length;G.party=b.ids;
    UI.quickMsg=(same?'ทีมตอนนี้เหมาะกับด่านถัดไปแล้ว':`จัดทีม: ${b.ids.map(k=>GEN[k].name).join(' · ')}${b.bd.length?' · ความผูกพัน: '+b.bd.map(x=>x.name).join(', '):''}`)+` (คิดธาตุศัตรูด่าน "${STAGES[teamTarget()].name}")`;save();render();},
  dlgGo:()=>{if(!B||!B.dialog)return;if(B.i>=0)G.seenDlg[B.i]=1;B.dialog=null;save();startRound();},
  sweep:d=>{const i=+d.i,n=+d.n||1;ensureSweep();if(G.stars[i]!==3||i>=G.cleared||G.sweep.n+n>SWEEP_MAX)return;const tot={gold:0,exp:0,stone:0,mats:{},gear:[]};
    for(let j=0;j<n;j++){const o=sweepOnce(i);tot.gold+=o.gold;tot.exp+=o.exp;tot.stone+=o.stone;for(const k in o.mats)tot.mats[k]=(tot.mats[k]||0)+o.mats[k];tot.gear.push(...o.gear);}G.sweep.n+=n;
    UI.sweepMsg=`กวาด ${STAGES[i].name} ×${n}: ${tot.gold.toLocaleString()} ตำลึง · ${tot.exp.toLocaleString()} EXP · หิน ${tot.stone} · ${Object.entries(tot.mats).map(([k,v])=>MATS[k].name+' '+v).join(', ')}${tot.gear.length?' · อุปกรณ์: '+tot.gear.join(', '):''}${EXP_OVER?` · EXP ส่วนเกิน ${EXP_OVER} ตำลึง`:''}`;EXP_OVER=0;sfx('coin');save();render();},
  chClaim:d=>{const c=+d.c,j=+d.j,cs=chStars(c),R=CH_REW[j];if(!R||cs.got<Math.ceil(cs.max*R.f))return;G.chStar[c]=G.chStar[c]||[];if(G.chStar[c][j])return;G.chStar[c][j]=1;const r=R.r;
    if(r.gold)G.gold+=r.gold*c;if(r.stone)G.items.stone+=r.stone;if(r.revive)G.items.revive+=r.revive;if(r.soul)G.items.soul+=r.soul;if(r.brk&&c>=5)G.items.brk+=r.brk;if(r.elixir)G.items.elixir+=r.elixir;
    if(r.gems)for(let x=0;x<r.gems;x++){const gk=gemKey(pick(Object.keys(GEMS)),2);G.gems[gk]=(G.gems[gk]||0)+1;}UI.sweepMsg='รับรางวัลดาวบทที่ '+c+': '+chRewText(r,c);sfx('win');save();render();},
  zhen:d=>{if(!ZHEN[d.k]||ZHEN[d.k].u>G.cleared)return;G.zhen=d.k;save();render();},
  toggleDg:()=>{seeSoon('dungeon');UI.showDg=!UI.showDg;render();},
  dgEl:d=>{UI.dgEl=d.k;render();},
  dgFight:d=>{ensureDungeon();const L=DG_LV[+d.d];if(!L||!fOpen('dungeon')||G.cleared<L.u||G.dungeon.used>=DG_TRIES)return;startBattle(-1,dungeonStage(+d.d));},
  camp:()=>{stopMusic();const fm=B&&B.fromMap;B=null;UI.eq=null;if(fm){UI.map=true;MV.flash=0;render();return;}if(UI.backTab){UI.tab=UI.backTab;UI.backTab=null;render();setTimeout(()=>{const e=document.getElementById('rebSec')||document.querySelector('.grow.open');if(e)e.scrollIntoView({block:'start'});},30);return;}UI.tab='stage';render();window.scrollTo(0,0);},
  mapOpen:()=>{mapInit();UI.map=true;UI.mapHere=null;render();window.scrollTo(0,0);},
  mapClose:()=>{UI.map=false;UI.mapHere=null;save();render();window.scrollTo(0,0);},
  mapTo:d=>{UI.map=false;UI.mapHere=null;UI.tab=d.k;save();render();window.scrollTo(0,0);},
  mapGo:d=>{const r=+d.r;if(!regionOpen(r)||r===MV.r)return;travel(r);},
  mapFight:d=>{const i=+d.i;if(i>G.cleared)return;UI.mapHere=null;startBattle(i);},
  mapFightH:d=>{const i=+d.i;if(i>=G.cleared)return;UI.mapHere=null;startBattle(i,heroicStage(i));},
  mapNpc:d=>{if(G.roster[d.g])return;UI.mapHere=null;startBattle(-1,npcStage(MV.r,d.g));},
};
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=H[el.dataset.act];if(f){try{f(el.dataset);}catch(x){crashScreen(x);}}});
H.crashBack=()=>{try{stopMusic();}catch(x){}B=null;UI.map=null;UI.bag=false;UI.tab='stage';UI.title=false;render();};
window.addEventListener('unhandledrejection',ev=>{if(B&&B.phase==='resolve'&&!B.result){B.phase='end';B.result=B.result||'flee';crashScreen(ev.reason||'battle');}});
let HOLD=null;
function stopHold(){if(HOLD){clearTimeout(HOLD.t);HOLD=null;}if(UI.holdUsed)setTimeout(()=>{UI.holdUsed=false;},60);}
app.addEventListener('pointerdown',e=>{const b=e.target.closest('button.hold[data-act=alloc]');if(!b||b.disabled)return;
  const k=b.dataset.s;let n=0;stopHold();HOLD={};
  const step=()=>{if(!HOLD)return;if(G.hero.pts<=0){stopHold();return;}n++;if(n>1)UI.holdUsed=true;allocN(k,n>20?5:1);HOLD.t=setTimeout(step,n<4?260:n<12?110:60);};
  HOLD.t=setTimeout(step,380);});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointerleave'&&e.target!==document)return;stopHold();}));
app.addEventListener('contextmenu',e=>{if(e.target.closest('button.hold'))e.preventDefault();});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.unit[data-act]')){e.preventDefault();e.target.click();}});

load();
render();
initCloud();
</script>
